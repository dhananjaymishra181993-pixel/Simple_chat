<!doctype html>
<html>
<head><meta charset="utf-8"><title>Login</title></head>
<body>
  <h2>Login</h2>
  <form id="form">
    <input placeholder="username" id="username" required /><br/>
    <input placeholder="password" id="password" type="password" required /><br/>
    <button>Login</button>
  </form>
  <div id="msg"></div>
  <script>
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'content-type':'application/json'},
        credentials: 'include',
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (res.ok) {
        // server set httpOnly cookie; save only visible user info locally
        localStorage.setItem('userId', data.userId);
        localStorage.setItem('username', data.username);
        window.location = '/users.html';
      } else {
        document.getElementById('msg').innerText = data.error || 'Error';
      }
    };
  </script>
</body>
</html>
